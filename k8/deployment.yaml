apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  namespace: surjan-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot
  template:
    metadata:
      labels:
        app: springboot
    spec:
      containers:
      - name: springboot
        image: surjan22/springboot_app:v1   # <-- replace with your image
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-service
  namespace: surjan-namespace
spec:
  type: NodePort
  selector:
    app: springboot
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080   # You can choose a port between 30000–32767
